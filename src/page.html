<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		
		<title>Translation Memory</title>
		<link rel="icon" type="image/svg+xml" href="/icon/language.svg">

		<style>
			html {
				--color-background: #ffffff;
				--color-background-popup: var(--color-background);
				--color-background-field: #f1f3f4;
				--color-background-field-focused: #e8eaed;
				--color-border: var(--color-background-field-focused);
				--color-border-popup: var(--color-background-field-focused);
				--color-text: #222222;
				--color-text-unfocused: #6f7070;
				--color-button: #0060df;
				--color-button-hover: #2374ff;
				--color-button-active: #3e90ff;
				--color-button-disabled: #c7c7ce;
				--color-button-text: #ffffff;
				--color-button-destructive: #ff0000;
				--color-button-destructive-hover: #f10000;
				--color-button-destructive-active: #e80000;
				--color-button-destructive-disabled: #c7c7ce;
				--color-button-destructive-text: #ffffff;
				--shadow: 0 3px 5px 3px rgba(15, 11, 11, 0.1);

				/* Dark mode for testing */
				/* --color-background: #000000;
				--color-background-popup: #222222;
				--color-background-field: #222222;
				--color-background-field-focused: #333333;
				--color-border: #222222;
				--color-border-popup: #444444;
				--color-text: #ffffff;
				--color-text-unfocused: #eeeeee;
				--shadow: none; */
			}
			body {
				margin: 0;
				
				background-color: var(--color-background);
				color: var(--color-text);
				font-family: Arial, Helvetica, sans-serif;
			}
			header {
				position: sticky;
				top: 0;

				background-color: var(--color-background);

				transition: 200ms box-shadow ease-in-out;
			}
			header.floating {
				box-shadow: var(--shadow);
			}

			#filters {
				display: flex;
				flex-direction: row;
				gap: 1rem;
				padding: 0.5rem 10vw 0.5rem 1rem;
			}
			#search {
				flex-grow: 1;
				padding: 0.75rem;

				background-color: var(--color-background-field);
				border-radius: 0.5rem;
				cursor: text;

				transition: background-color 100ms;
			}
			#search:is(:hover, :focus-within) {
				background-color: var(--color-background-field-focused);
			}
			#searchIcon {
				position: relative;
				top: 0.05rem;
				width: 1rem;
				height: 1rem;
				margin-right: 0.2rem;

				color: var(--color-text);

				-webkit-user-select: none;
				user-select: none;
			}
			#searchField {
				width: calc(100% - 2rem);

				border: none;
				outline: none;
				font-size: 1rem !important;

				background-color: transparent;
				caret-color: var(--color-text);
				color: var(--color-text);

				transition: background-color 100ms;
			}
			#searchField::placeholder {
				color: var(--color-text-unfocused);
			}
			#languagesAndScopesButton {
				padding: 0.75rem;

				border: none;
				outline: none;
				font-size: 1rem !important;

				border-radius: 0.5rem;
				color: var(--color-text);
				background-color: var(--color-background-field);
				cursor: pointer;

				transition: all 100ms;
			}
			#languagesAndScopesButton::after {
				content: '🞃';

				position: relative;
				bottom: 0.1rem;
				padding-left: 0.5rem;

				color: var(--color-text-unfocused);
			}
			#languagesAndScopesButton:hover {
				background-color: var(--color-background-field-focused);
			}

			header, .translation:not(:last-child) {
				border-bottom: 1px solid var(--color-border);
			}
			#titles {
				display: flex;
				flex-direction: row;

				font-weight: bold;
			}
			#translations {
				margin: 0;
				padding: 0;
				overflow: auto;
				height: calc(100vh - 7rem - 1px);
			}
			.translation {
				display: flex;
				flex-direction: row;
			}
			.translation:hover {
				background-color: var(--color-background-field);
			}
			.originalText, .translationText, #originalsTitle, #translationsTitle {
				width: 45vw;
				margin: 0;
				padding: 1rem;
				overflow-wrap: break-word;
			}

			.open > #languagesAndScopesButton {
				border-radius: 0.5rem 0.5rem 0 0;

				background-color: var(--color-background-field-focused);
			}
			#languagesAndScopesDialog {
				position: absolute;
				right: 3vw;
				display: flex;
				flex-direction: row;
				width: max-content;
				padding: 0.75rem;
				border-radius: 0.5rem;

				background-color: var(--color-background-popup);
				box-shadow: var(--shadow);
				opacity: 1;

				transition: all 100ms;
			}
			:not(.open) > #languagesAndScopesDialog {
				visibility: hidden;
				opacity: 0;
			}
			#languagesAndScopesDialog > div {
				display: flex;
				flex-direction: column;
				gap: 0.5rem;
			}
			#languagesAndScopesDialog > div:first-child {
				padding: 0 1rem 0 0;
				border-right: var(--color-border-popup) 1px solid;
				margin: 0 1rem 0 0;
			}
			#allLanguagesCheckboxContainer, #allScopesCheckboxContainer {
				display: flex;
				gap: 0.5rem;
				padding-bottom: 0.5rem;
				border-bottom: var(--color-border-popup) 1px solid;
			}
			#languages, #scopes {
				padding: 0;
				margin: 0;

				list-style: none;
			}
			#languagesAndScopes li, #languagesAndScopes li > label {
				display: flex;
				flex-direction: row;
				align-items: center;
				gap: 0.5rem;
			}
			#languagesAndScopes li:not(:last-child) {
				margin-bottom: 0.5rem;
			}
			#languagesAndScopes input[type="checkbox"] {
				width: 1.2rem;
				height: 1.2rem;
				margin: 0;

				accent-color: var(--color-button);
			}
			#languagesAndScopes input[type="checkbox"]:hover {
				accent-color: var(--color-button-hover);
			}
			#languagesAndScopes input[type="checkbox"]:active {
				accent-color: var(--color-button-active);
			}
			#languagesAndScopes input[type="checkbox"]:disabled {
				accent-color: var(--color-button-disabled);
			}
			#languagesAndScopes:not(.editLanguages) #newLanguageField,
			#languagesAndScopes:not(.editLanguages) #cancelChangesButton,
			#languagesAndScopes:not(.editLanguages) #saveChangesButton,
			#languagesAndScopes:not(.editLanguages) .deleteLanguageButton,
			.editLanguages #languages input[type="checkbox"],
			.editLanguages #editLanguagesButton
			{
				display: none;
			}
			#newLanguageField {
				width: 3rem;
				margin-left: 1.7rem;

				font-size: 1rem;
			}
			#languagesAndScopes:not(.editLanguages) #languages, #newLanguageField, #scopes {
				margin-bottom: auto;
			}
			#editLanguagesButton, #cancelChangesButton, #downloadMissingButton {
				margin-top: 1rem;
			}

			#languagesAndScopes:not(.loading) #loadingSpinner {
				visibility: hidden;
				opacity: 0;
			}
			#loadingSpinner {
				position: absolute;
				display: flex;
				justify-content: center;
				align-items: center;
				width: calc(100% - 1.5rem + 1px);
				height: calc(100% - 1.5rem + 1px);

				background-color: color-mix(in srgb, var(--color-background-popup) 75%, transparent);
				opacity: 1;

				transition: all 100ms;
			}
			#loadingSpinner > img {
				height: 50%;

				animation: loading 2s linear infinite;
			}
			@keyframes loading {
				0% { transform: rotate(0deg); }
				100% { transform: rotate(360deg); }
			}

			.smallButton {
				font-size: 1rem !important;
				width: 100%;
				padding: 1px 0.75rem;
				border: none;
				border-radius: 1rem;
				outline: none;

				color: var(--color-button-text);
				background-color: var(--color-button);

				transition: all 100ms;
			}
			.smallButton:hover {
				background-color: var(--color-button-hover);
			}
			.smallButton:active {
				background-color: var(--color-button-active);
			}
			.smallButton:disabled {
				background-color: var(--color-button-disabled);
			}
			.deleteLanguageButton {
				width: 1.2rem;
				height: 1.2rem;
				padding: 0.1rem;
				border: none;
				border-radius: 50%;
				outline: none;

				transition: all 100ms;
			}
			:is(.deleteLanguageButton, .smallButton.destructive) {
				color: var(--color-button-destructive-text);
				background-color: var(--color-button-destructive);
			}
			:is(.deleteLanguageButton, .smallButton.destructive):hover {
				background-color: var(--color-button-destructive-hover);
			}
			:is(.deleteLanguageButton, .smallButton.destructive):active {
				background-color: var(--color-button-destructive-active);
			}
			:is(.deleteLanguageButton, .smallButton.destructive):disabled {
				background-color: var(--color-button-destructive-disabled);
			}
			.deleteLanguageButton > img {
				width: 1rem;
				height: 1rem;
			}
		</style>
	</head>
	<body>
		<header>
			<div id="filters">
				<div id="search">
					<img id="searchIcon" src="/icon/search.svg">
					<input id="searchField" type="text" placeholder="Search">
				</div>
				<div id="languagesAndScopes">
					<button id="languagesAndScopesButton">Languages & Scopes</button>
					<div id="languagesAndScopesDialog">
						<div>
							<label id="allLanguagesCheckboxContainer">
								<input id="allLanguagesCheckbox" type="checkbox">
								<span id="allLanguagesCheckboxLabel">All languages</span>
							</label>
							<ul id="languages"></ul>
							<input id="newLanguageField" type="text">
							<button class="smallButton" id="editLanguagesButton">Edit languages</button>
							<button class="smallButton destructive" id="cancelChangesButton">Cancel</button>
							<button class="smallButton" id="saveChangesButton">Save languages</button>
						</div>
						<div>
							<label id="allScopesCheckboxContainer">
								<input id="allScopesCheckbox" type="checkbox">
								<span id="allScopesCheckboxLabel">All scopes</span>
							</label>
							<ul id="scopes"></ul>
							<button class="smallButton" id="downloadMissingButton">Download missing</button>
						</div>
						<div id="loadingSpinner">
							<img src="/icon/loading.svg">
						</div>
					</div>
				</div>
			</div>

			<div id="titles">
				<p id="originalsTitle">Original</p>
				<p id="translationsTitle">Translation</p>
			</div>
		</header>

		<ul id="translations"></ul>

		<script>
			const header = document.getElementsByTagName("header")[0];
			const search = document.getElementById("search");
			const searchField = document.getElementById("searchField");

			const languagesAndScopes = document.getElementById("languagesAndScopes");
			const languagesAndScopesButton = document.getElementById("languagesAndScopesButton");
			const languageList = document.getElementById("languages");
			const scopeList = document.getElementById("scopes");

			const allScopesCheckbox = document.getElementById("allScopesCheckbox");
			const allScopesCheckboxLabel = document.getElementById("allScopesCheckboxLabel");
			const allLanguagesCheckbox = document.getElementById("allLanguagesCheckbox");
			const allLanguagesCheckboxLabel = document.getElementById("allLanguagesCheckboxLabel");

			const editLanguagesButton = document.getElementById("editLanguagesButton");
			const newLanguageField = document.getElementById("newLanguageField");
			const cancelChangesButton = document.getElementById("cancelChangesButton");
			const saveChangesButton = document.getElementById("saveChangesButton");
			const downloadMissingButton = document.getElementById("downloadMissingButton");

			const originalsTitle = document.getElementById("originalsTitle");
			const translationsTitle = document.getElementById("translationsTitle");

			const translationList = document.getElementById("translations");

			/**
			 * @define { <id>: { name: string, downloaded: bool, groupName?: string } }
			 */
			let scopeNames = {};

			/**
			 * @define { <name>: bool }
			 */
			let languageFilters = {};

			/**
			 * @define { <name>: bool }
			 */
			let scopeFilters = {};

			/**
			 * @define [ string ]
			 */
			let languages = [];
			
			/**
			 * @define [ string ]
			 */
			let newLanguages = [];

			document.title = "Omsetjingsminne";
			searchField.placeholder = "Søk";
			languagesAndScopesButton.innerText = "Mål og vidd";
			originalsTitle.innerText = "Opprinneleg";
			translationsTitle.innerText = "Omsetjing";
			allLanguagesCheckboxLabel.innerText = "Alle mål";
			allScopesCheckboxLabel.innerText = "Alle vidder";
			editLanguagesButton.innerText = "Endra mål";
			cancelChangesButton.innerText = "Avbryt";
			saveChangesButton.innerText = "Lagra mål";
			downloadMissingButton.innerText = "Last ned manglande";

			refreshAll();

			// Add listeners to elements
			
			translationList.onscroll = e => {
				if (e.target.scrollTop === 0) {
					header.classList.remove("floating");
				} else {
					header.classList.add("floating");
				}
			};

			let lastUpdated = Date.now();
			searchField.oninput = e => {
				const now = Date.now();
				lastUpdated = now;
				setTimeout(() => {
					if (lastUpdated === now) {
						refreshTranslations();
					}
				}, 250);
			};
			searchField.onkeypress = e => {
				if (e.key !== "Enter") { return; }
				refreshTranslations();
			}

			search.onclick = e => {
				if (e.target == searchField) return;
				searchField.focus();
				searchField.setSelectionRange(searchField.value.length, searchField.value.length + 1);
			};

			window.onmousedown = e => {
				if (languagesAndScopes.classList.contains("editLanguages")
				 || languagesAndScopes.classList.contains("loading"))
				{ return; }

				if (!languagesAndScopes.contains(e.target)) {
					languagesAndScopes.classList.remove("open");
				};
			};
			languagesAndScopesButton.onclick = e => {
				if (languagesAndScopes.classList.contains("editLanguages")
				 || languagesAndScopes.classList.contains("loading"))
				{ return; }

				if (languagesAndScopes.classList.contains("open")) {
					languagesAndScopes.classList.remove("open");
				} else {
					languagesAndScopes.classList.add("open");
				}
			};

			allLanguagesCheckbox.oninput = e => {
				languageList.childNodes.forEach(e => e.childNodes[1].firstChild.checked = allLanguagesCheckbox.checked);
				for (language in languageFilters) {
					languageFilters[language] = allLanguagesCheckbox.checked;
				}
				refreshTranslations();
			}
			allScopesCheckbox.oninput = e => {
				scopeList.childNodes.forEach(e => e.firstChild.firstChild.checked = allScopesCheckbox.checked);
				for (scope in scopeFilters) {
					scopeFilters[scope] = allScopesCheckbox.checked;
				}
				refreshTranslations();
			}

			editLanguagesButton.onclick = e => {
				scopeList.childNodes.forEach(e => e.firstChild.firstChild.disabled = true);
				allLanguagesCheckbox.disabled = true;
				allScopesCheckbox.disabled = true;
				downloadMissingButton.disabled = true;
				languagesAndScopes.classList.add("editLanguages");
				newLanguageField.value = "";
				newLanguageField.focus();
				newLanguages = [...languages];
				populateLanguages(languages);
			};
			cancelChangesButton.onclick = e => {
				scopeList.childNodes.forEach(e => e.firstChild.firstChild.disabled = false);
				allLanguagesCheckbox.disabled = false;
				allScopesCheckbox.disabled = false;
				downloadMissingButton.disabled = false;
				languagesAndScopes.classList.remove("editLanguages");
				populateLanguages(languages);
			};
			saveChangesButton.onclick = e => {
				scopeList.childNodes.forEach(e => e.firstChild.firstChild.disabled = false);
				allLanguagesCheckbox.disabled = false;
				allScopesCheckbox.disabled = false;
				downloadMissingButton.disabled = false;
				languagesAndScopes.classList.add("loading");
				languagesAndScopes.classList.remove("editLanguages");
				populateLanguages(languages);

				fetch("http://127.0.0.1:2013/update_all", {
					method: "POST",
					headers: {
						"Content-Type": "application/json",
					},
					body: JSON.stringify({ languages: newLanguages }),
				}).then(
					async () => {
						await refreshAll();
						languagesAndScopes.classList.remove("loading");
					},
					e => {
						console.error(e);
						languagesAndScopes.classList.remove("loading");
					},
				)
			};
			newLanguageField.addEventListener("focusout", e => {
				if (!newLanguageField.value) { return; }
				newLanguages.push(newLanguageField.value);
				newLanguageField.value = "";
				populateLanguages(newLanguages);
			});
			newLanguageField.addEventListener("keypress", e => {
				if (e.key !== "Enter") { return; }
				if (!newLanguageField.value) { return; }
				newLanguages.push(newLanguageField.value);
				newLanguageField.value = "";
				populateLanguages(newLanguages);
			});
			downloadMissingButton.onclick = e => {
				languagesAndScopes.classList.add("loading");

				fetch("http://127.0.0.1:2013/update", {
					method: "POST",
					headers: {
						"Content-Type": "application/json",
					},
					body: JSON.stringify({
						languages: Object.keys(languageFilters),
						scopes: Object.entries(scopeNames).filter(([k, { downloaded }]) => !downloaded).map(([k]) => k),
					}),
				}).then(
					async () => {
						await refreshAll();
						languagesAndScopes.classList.remove("loading");
					},
					e => {
						console.error(e);
						languagesAndScopes.classList.remove("loading");
					},
				)
			};

			// Functions

			/**
			 * Replace the languages and scopes in `languageList` and `scopeList` with new ones.
			 */
			function refreshAll() {
				fetch("http://127.0.0.1:2013/metadata").then(
					async response => {
						const metadata = await response.json();

						languages = metadata.languages;

						languageFilters = Object.fromEntries(
							metadata.languages.map(language => [language, languageFilters[language] ?? true])
						);

						scopeNames = {};
						let newScopeFilters = {};
						for (let scope of metadata.scopes) {
							if (scope.id) {
								scopeNames[scope.id] = { "name": scope.name, "downloaded": scope.downloaded };
								newScopeFilters[scope.id] = scopeFilters[scope.id] ?? true;
							} else {
								for (let s of scope.scopes) {
									scopeNames[s.id] = { "name": s.name, "downloaded": s.downloaded, "groupName": scope.name };
									newScopeFilters[s.id] = scopeFilters[s.id] ?? true;
								}
							}
						}
						scopeFilters = newScopeFilters;

						populateLanguages(metadata.languages);
						populateScopes(metadata.scopes);

						refreshTranslations();
					},
					e => console.error(e),
				)
			}

			/**
			 * Replace the contents of `languageList` with `languages`.
			 */
			function populateLanguages(languages) {
				languageList.replaceChildren();
				
				updateCheckbox(allLanguagesCheckbox, languageFilters);

				for (let lang of languages.toSorted()) {
					let li = document.createElement("li");

					let deleteButton = document.createElement("button");
					deleteButton.classList.add("deleteLanguageButton");
					deleteButton.onclick = e => {
						const index = newLanguages.indexOf(lang);
						newLanguages.splice(index, 1);
						populateLanguages(newLanguages);
					};
					let deleteIcon = document.createElement("img");
					deleteIcon.src = "/icon/remove.svg";
					deleteIcon.alt = "Remove language from list";
					deleteButton.appendChild(deleteIcon);
					li.appendChild(deleteButton);

					let label = document.createElement("label");

					let input = document.createElement("input");
					input.type = "checkbox";
					languageFilters[lang] = languageFilters[lang] ?? true;
					input.checked = languageFilters[lang];
					input.oninput = () => {
						languageFilters[lang] = input.checked;
						updateCheckbox(allLanguagesCheckbox, languageFilters);
						refreshTranslations();
					};
					label.appendChild(input);

					let span = document.createElement("span");
					span.appendChild(document.createTextNode(lang));
					label.appendChild(span);

					li.appendChild(label);

					languageList.appendChild(li);
				}
			}

			/**
			 * Replace the contents of `scopeList` with `scopes`.
			 */
			function populateScopes(scopes) {
				scopeList.replaceChildren();

				updateCheckbox(allScopesCheckbox, scopeFilters);

				for (let scope of scopes.toSorted((a, b) => a.name > b.name)) {
					let li = document.createElement("li");
					let label = document.createElement("label");

					let input = document.createElement("input");
					input.type = "checkbox";
					input.checked = scope.id ? scopeFilters[scope.id] : scope.scopes.reduce((prev, curr) => prev || curr);
					input.oninput = e => {
						if (scope.id) {
							scopeFilters[scope.id] = input.checked;
						} else {
							for (let s of scope.scopes) {
								scopeFilters[s.id] = input.checked;
							}
						}
						updateCheckbox(allScopesCheckbox, scopeFilters);
						refreshTranslations();
					};
					label.appendChild(input);

					let span = document.createElement("span");
					span.appendChild(document.createTextNode(scope.name));
					label.appendChild(span);

					li.appendChild(label)
					scopeList.appendChild(li);
				}

				let missingDownloads = scopes.reduce((acc, { downloaded, scopes, name }) => {
					if (acc) { return true; }

					if (scopes) {
						return scopes.reduce((acc, { downloaded }) => acc || !downloaded, false);
					} else {
						return !downloaded;
					}
				}, false);
				downloadMissingButton.style.display = missingDownloads ? "" : "none";
			}

			function updateCheckbox(checkbox, filters) {
				if (Object.getOwnPropertyNames(filters).length) {
					let checked = Object.values(filters).reduce((acc, checked) => acc === checked ? acc : null);
					if (checked === null) {
						checkbox.checked = true;
						checkbox.indeterminate = true;
					} else {
						checkbox.checked = checked;
						checkbox.indeterminate = false;
					}
				} else {
					checkbox.checked = true;
				}
			}

			/**
			 * @typedef Translation
			 * @type {object}
			 * @property original {string} - original string
			 * @property translation {string} - translated string
			 * @property comment {string} - comment describing the context regarding the translation
			 */
			
			/**
			 * Replace the translations in `translationList` with new ones.
			 */
			function refreshTranslations() {
				const languages = Object.entries(languageFilters).filter(([k, v]) => v).map(([k, v]) => k);
				const scopes = Object.entries(scopeFilters).filter(([k, v]) => v).map(([k, v]) => k);
				fetch(`http://127.0.0.1:2013/query?regex=${searchField.value}&scopes=${scopes.join()}&languages=${languages.join()}&limit=500`).then(
					async response => {
						const translations = await response.json();

						let regex = null;
						try {
							regex = new RegExp(searchField.value, "gi");
						} catch (e) {
							console.warn(e);
						}
						populateTranslations(translations, regex);

						window.scrollTo(0, 0);
					},
					e => console.error(e),
				)
			}

			/**
			 * Replace the contents of `translationList` with `translations`.
			 * 
			 * @param translations {[Translation]} - list of translations to use
			 * @param search {RegExp?} - regex to highlight certain sections of text
			 */
			function populateTranslations(translations, search) {
				translationList.replaceChildren();

				for (let translation of translations) {
					const scope = scopeNames[translation.scope];

					let li = document.createElement("li");
					li.title = `${translation.language} - ${scope?.name ? scope.name : translation.scope}${scope?.groupName ? ` (${scope.groupName})` : ""}\n${translation.comment ? translation.comment : ""}`;
					li.classList.add("translation");

					let originalText = document.createElement("p");
					originalText.classList.add("originalText");

					let translationText = document.createElement("p");
					translationText.classList.add("translationText");

					if (search) {
						embolden(originalText, search, translation.original);
						embolden(translationText, search, translation.translation);
					} else {
						originalText.innerText = translation.original;
						translationText.innerText = translation.translation;
					}

					li.appendChild(originalText);
					li.appendChild(translationText);
					translationList.appendChild(li);
				}
			}

			/**
			 * Appends `text` to `container` with `regex` matches wrapped in bold tags.
			 * 
			 * @param container {HTMLElement} - element to append the formatted `text` into
			 * @param regex {RegExp} - regex to match against `text`
			 */
			function embolden(container, regex, text) {
				let lastIndex = 0;

				for (let match of text.matchAll(regex)) {
					container.appendChild(document.createTextNode(text.substring(lastIndex, match.index)));

					let emboldened = document.createElement("b");
					emboldened.appendChild(document.createTextNode(match[0]));
					container.appendChild(emboldened);

					lastIndex = match.index + match[0].length;
				}
				container.appendChild(document.createTextNode(text.substring(lastIndex, text.length)));
			}
		</script>
	</body>
</html>
