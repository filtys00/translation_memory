<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		
		<title>Translation Memory</title>
		<link rel="icon" type="image/svg+xml" href="/icon/language.svg">

		<style>
			html {
				--color-background: #ffffff;
				--color-background-popup: var(--color-background);
				--color-background-field: #f1f3f4;
				--color-background-field-focused: #e8eaed;
				--color-border: var(--color-background-field-focused);
				--color-border-popup: var(--color-background-field-focused);
				--color-text: #222222;
				--color-text-unfocused: #6f7070;
				--shadow: 0 3px 5px 3px rgba(15, 11, 11, 0.1);

				/* Dark mode for testing */
				/* --color-background: #000000;
				--color-background-popup: #222222;
				--color-background-field: #222222;
				--color-background-field-focused: #333333;
				--color-border: #222222;
				--color-border-popup: #444444;
				--color-text: #ffffff;
				--color-text-unfocused: #eeeeee;
				--shadow: none; */
			}
			body {
				margin: 0;
				
				background-color: var(--color-background);
				color: var(--color-text);
				font-family: Arial, Helvetica, sans-serif;
			}
			header {
				position: sticky;
				top: 0;

				background-color: var(--color-background);

				transition: 200ms box-shadow ease-in-out;
			}
			header.floating {
				box-shadow: var(--shadow);
			}

			#filters {
				display: flex;
				flex-direction: row;
				gap: 1rem;
				padding: 0.5rem 10vw 0.5rem 1rem;
			}
			#search {
				flex-grow: 1;
				padding: 0.75rem;

				background-color: var(--color-background-field);
				border-radius: 0.5rem;
				cursor: text;

				transition: background-color 100ms;
			}
			#search:is(:hover, :focus-within) {
				background-color: var(--color-background-field-focused);
			}
			#searchIcon {
				position: relative;
				top: 0.05rem;
				width: 1rem;
				height: 1rem;
				margin-right: 0.2rem;

				color: var(--color-text);

				-webkit-user-select: none;
				user-select: none;
			}
			#searchField {
				width: calc(100% - 2rem);

				border: none;
				outline: none;
				font-size: 1rem !important;

				background-color: transparent;
				caret-color: var(--color-text);
				color: var(--color-text);

				transition: background-color 100ms;
			}
			#searchField::placeholder {
				color: var(--color-text-unfocused);
			}
			#languagesAndScopesButton {
				padding: 0.75rem;

				border: none;
				outline: none;
				font-size: 1rem !important;

				border-radius: 0.5rem;
				color: var(--color-text);
				background-color: var(--color-background-field);
				cursor: pointer;

				transition: all 100ms;
			}
			#languagesAndScopesButton::after {
				content: '🞃';

				position: relative;
				bottom: 0.1rem;
				padding-left: 0.5rem;

				color: var(--color-text-unfocused);
			}
			#languagesAndScopesButton:hover {
				background-color: var(--color-background-field-focused);
			}

			header, .translation:not(:last-child) {
				border-bottom: 1px solid var(--color-border);
			}
			#titles {
				display: flex;
				flex-direction: row;

				font-weight: bold;
			}
			#translations {
				margin: 0;
				padding: 0;
				overflow: auto;
				height: calc(100vh - 7rem - 1px);
			}
			.translation {
				display: flex;
				flex-direction: row;
			}
			.translation:hover {
				background-color: var(--color-background-field);
			}
			.originalText, .translationText, #originalsTitle, #translationsTitle {
				width: 45vw;
				margin: 0;
				padding: 1rem;
				overflow-wrap: break-word;
			}

			#languagesAndScopesDialog {
				display: flex;
				flex-direction: column;
				gap: 0.5rem;
				position: absolute;
				padding: 0.75rem;

				background-color: var(--color-background-popup);
				border-radius: 0.5rem;
				box-shadow: var(--shadow);
				opacity: 1;

				transition: all 100ms;
			}
			.open > #languagesAndScopesDialog {
				border-radius: 0 0.5rem 0.5rem 0.5rem;
			}
			:not(.open) > #languagesAndScopesDialog {
				visibility: hidden;
				opacity: 0;
				cursor: default;
			}
			.open > #languagesAndScopesButton {
				border-radius: 0.5rem 0.5rem 0 0;

				background-color: var(--color-background-field-focused);
			}
			#languagesAndScopesMain {
				display: flex;
				flex-direction: row;
			}
			#languagesAndScopesButtons {
				display: flex;
				flex-direction: row;
			}
			#languagesAndScopesButtons > button {
				width: 100%;
				border: none;
				outline: none;
				font-size: 1rem !important;

				color: white;
				background-color: #0060df;
				cursor: pointer;

				transition: all 100ms;
			}
			#languagesAndScopesButtons > button:first-child {
				border-top-left-radius: 1rem;
				border-bottom-left-radius: 1rem;
				padding-left: 0.75rem;
			}
			#languagesAndScopesButtons > button:last-child {
				border-top-right-radius: 1rem;
				border-bottom-right-radius: 1rem;
				padding-right: 0.75rem;
			}
			#languagesAndScopesButtons > button:hover {
				background-color: #2374ff;
			}
			#languagesAndScopesButtons > button:active {
				background-color: #3e90ff;
			}
			#languages, #scopes {
				margin: 0;
				padding: 0;

				list-style: none;
			}
			#languages {
				border-right: var(--color-border-popup) 1px solid;
				margin: 0 1rem 0 0;
				padding: 0 1rem 0 0;
			}
			:is(#languages, #scopes) > li {
				display: flex;
				flex-direction: row;
				gap: 0.5rem;
				align-items: center;
			}
			:is(#languages, #scopes) > li:not(:last-child) {
				margin-bottom: 0.5rem;
			}
			:is(#languages, #scopes) > li > input {
				width: 1.2rem;
				height: 1.2rem;
				margin: 0;
			}

			#languagesAndScopes:not(.loading) #loadingSpinner {
				visibility: hidden;
				opacity: 0;
			}
			#loadingSpinner {
				position: absolute;
				display: flex;
				justify-content: center;
				align-items: center;
				width: calc(100% - 1.5rem + 1px);
				height: calc(100% - 1.5rem + 1px);

				background-color: color-mix(in srgb, var(--color-background-popup) 75%, transparent);
				opacity: 1;

				transition: all 100ms;
			}
			#loadingSpinner > img {
				height: 50%;

				animation: loading 2s linear infinite;
			}
			@keyframes loading {
				0% { transform: rotate(0deg); }
				100% { transform: rotate(360deg); }
			}
		</style>
	</head>
	<body>
		<header>
			<div id="filters">
				<div id="search">
					<img id="searchIcon" src="/icon/search.svg">
					<input id="searchField" type="text" placeholder="Search">
				</div>
				<div id="languagesAndScopes">
					<button id="languagesAndScopesButton">Languages & Scopes</button>
					<div id="languagesAndScopesDialog">
						<div id="languagesAndScopesMain">
							<ul id="languages"></ul>
							<ul id="scopes"></ul>
						</div>
						<div id="languagesAndScopesButtons">
							<button id="downloadMissingButton">Download missing</button>
						</div>
						<div id="loadingSpinner">
							<img src="/icon/loading.svg">
						</div>
					</div>
				</div>
			</div>

			<div id="titles">
				<p id="originalsTitle">Original</p>
				<p id="translationsTitle">Translation</p>
			</div>
		</header>

		<ul id="translations"></ul>

		<script>
			const header = document.getElementsByTagName("header")[0];
			const search = document.getElementById("search");
			const searchField = document.getElementById("searchField");

			const languagesAndScopes = document.getElementById("languagesAndScopes");
			const languagesAndScopesButton = document.getElementById("languagesAndScopesButton");
			const languageList = document.getElementById("languages");
			const scopeList = document.getElementById("scopes");
			const downloadMissingButton = document.getElementById("downloadMissingButton");

			const originalsTitle = document.getElementById("originalsTitle");
			const translationsTitle = document.getElementById("translationsTitle");

			const translationList = document.getElementById("translations");

			/**
			 * @define { <id>: { name: string, downloaded: bool, groupName?: string } }
			 */
			let scopeNames = {};

			/**
			 * @define { <name>: bool }
			 */
			let languageFilters = {};

			/**
			 * @define { <name>: bool }
			 */
			let scopeFilters = {};

			document.title = "Omsetjingsminne";
			searchField.placeholder = "Søk";
			languagesAndScopesButton.innerText = "Mål og vidd";
			originalsTitle.innerText = "Opprinneleg";
			translationsTitle.innerText = "Omsetjing";
			downloadMissingButton.innerText = "Last ned manglande";

			refreshMetadata();
			refreshTranslations();

			// Add listeners to elements
			
			translationList.onscroll = e => {
				if (e.target.scrollTop === 0) {
					header.classList.remove("floating");
				} else {
					header.classList.add("floating");
				}
			};

			let lastUpdated = Date.now();
			searchField.oninput = e => {
				const now = Date.now();
				lastUpdated = now;
				setTimeout(() => {
					if (lastUpdated === now) {
						refreshTranslations();
					}
				}, 250);
			};
			searchField.onkeypress = e => {
				if (e.key !== "Enter") { return; }
				refreshTranslations();
			}

			search.onclick = e => {
				if (e.target == searchField) return;
				searchField.focus();
				searchField.setSelectionRange(searchField.value.length, searchField.value.length + 1);
			};

			window.onmousedown = e => {
				if (languagesAndScopes.classList.contains("loading")) { return; }

				if (!languagesAndScopes.contains(e.target)) {
					languagesAndScopes.classList.remove("open");
				};
			};
			languagesAndScopesButton.onclick = e => {
				if (languagesAndScopes.classList.contains("loading")) { return; }

				if (languagesAndScopes.classList.contains("open")) {
					languagesAndScopes.classList.remove("open");
				} else {
					languagesAndScopes.classList.add("open");
				}
			};

			downloadMissingButton.onclick = e => {
				languagesAndScopes.classList.add("loading");
				let body = {
					"languages": Object.keys(languageFilters),
					"scopes": Object.entries(scopeNames).filter(([k, { downloaded }]) => !downloaded).map(([k]) => k),
				};
				let httpRequest = new XMLHttpRequest();
				httpRequest.open("POST", "http://127.0.0.1:2013/update", true);
				httpRequest.onreadystatechange = e => {
					if (httpRequest.readyState === XMLHttpRequest.DONE) {
						if (httpRequest.status === 200) {
							refreshMetadata();
							refreshTranslations();
						} else {
							console.error(e);
						}
						languagesAndScopes.classList.remove("loading");
					}
				};
				httpRequest.setRequestHeader("Content-Type", "application/json")
				httpRequest.send(JSON.stringify(body));
			};

			// Functions

			/**
			 * Replace the languages and scopes in `languageList` and `scopeList` with new ones.
			 */
			function refreshMetadata() {
				let httpRequest = new XMLHttpRequest();
				httpRequest.open("GET", "http://127.0.0.1:2013/metadata", false);
				httpRequest.onreadystatechange = e => {
					if (httpRequest.readyState === XMLHttpRequest.DONE) {
						if (httpRequest.status === 200) {
							const metadata = JSON.parse(httpRequest.responseText);

							for (let scope of metadata.scopes) {
								if (scope.id) {
									scopeNames[scope.id] = { "name": scope.name, "downloaded": scope.downloaded };
									scopeFilters[scope.id] = scopeFilters[scope.id] ?? true;
								} else {
									for (let s of scope.scopes) {
										scopeNames[s.id] = { "name": s.name, "downloaded": s.downloaded, "groupName": scope.name };
										scopeFilters[s.id] = scopeFilters[s.id] ?? true;
									}
								}
							}

							populateLanguages(metadata.languages);
							populateScopes(metadata.scopes);
						} else {
							console.error(e);
						}
					}
				};
				httpRequest.send();
			}

			/**
			 * Replace the contents of `languageList` with `languages`.
			 */
			function populateLanguages(languages) {
				languageList.replaceChildren();

				for (let lang of languages.toSorted()) {
					let li = document.createElement("li");

					let input = document.createElement("input");
					input.type = "checkbox";
					languageFilters[lang] = languageFilters[lang] ?? true;
					input.checked = languageFilters[lang];
					input.oninput = () => {
						languageFilters[lang] = input.checked;
						refreshTranslations();
					};
					li.appendChild(input);

					let span = document.createElement("span");
					span.appendChild(document.createTextNode(lang));
					li.appendChild(span);

					languageList.appendChild(li);
				}
			}

			/**
			 * Replace the contents of `scopeList` with `scopes`.
			 */
			function populateScopes(scopes) {
				scopeList.replaceChildren();

				for (let scope of scopes.toSorted((a, b) => a.name > b.name)) {
					let li = document.createElement("li");

					let input = document.createElement("input");
					input.type = "checkbox";
					input.checked = scope.id ? scopeFilters[scope.id] : scope.scopes.reduce((prev, curr) => prev || curr);
					input.oninput = e => {
						if (scope.id) {
							scopeFilters[scope.id] = input.checked;
						} else {
							for (let s of scope.scopes) {
								scopeFilters[s.id] = input.checked;
							}
						}
						refreshTranslations();
					};
					li.appendChild(input);

					let span = document.createElement("span");
					span.appendChild(document.createTextNode(scope.name));
					li.appendChild(span);

					scopeList.appendChild(li);
				}
			}

			/**
			 * @typedef Translation
			 * @type {object}
			 * @property original {string} - original string
			 * @property translation {string} - translated string
			 * @property comment {string} - comment describing the context regarding the translation
			 */
			
			/**
			 * Replace the translations in `translationList` with new ones.
			 */
			function refreshTranslations() {
				let httpRequest = new XMLHttpRequest();
				httpRequest.open("GET", `http://127.0.0.1:2013/query?regex=${searchField.value}&limit=500&scopes=${Object.entries(scopeFilters).filter(([k, v]) => v).map(([k, v]) => k).join()}&languages=${Object.entries(languageFilters).filter(([k, v]) => v).map(([k, v]) => k).join()}`, true);
				httpRequest.onreadystatechange = (e) => {
					if (httpRequest.readyState === XMLHttpRequest.DONE) {
						if (httpRequest.status === 200) {
							const t = JSON.parse(httpRequest.responseText);
							
							let regex = null;
							try {
								regex = new RegExp(searchField.value, "gi");
							} catch (e) {
								console.warn(e);
							}
							populateTranslations(t, regex);

							window.scrollTo(0, 0);
						} else {
							console.error(e);
						}
					}
				};
				httpRequest.send();
			}

			/**
			 * Replace the contents of `translationList` with `translations`.
			 * 
			 * @param translations {[Translation]} - list of translations to use
			 * @param search {RegExp?} - regex to highlight certain sections of text
			 */
			function populateTranslations(translations, search) {
				translationList.replaceChildren();

				for (let translation of translations) {
					const scope = scopeNames[translation.scope];

					let li = document.createElement("li");
					li.title = `${translation.language} - ${scope?.name ? scope.name : translation.scope}${scope?.groupName ? ` (${scope.groupName})` : ""}\n${translation.comment ? translation.comment : ""}`;
					li.classList.add("translation");

					let originalText = document.createElement("p");
					originalText.classList.add("originalText");

					let translationText = document.createElement("p");
					translationText.classList.add("translationText");

					if (search) {
						embolden(originalText, search, translation.original);
						embolden(translationText, search, translation.translation);
					} else {
						originalText.innerText = translation.original;
						translationText.innerText = translation.translation;
					}

					li.appendChild(originalText);
					li.appendChild(translationText);
					translationList.appendChild(li);
				}
			}

			/**
			 * Appends `text` to `container` with `regex` matches wrapped in bold tags.
			 * 
			 * @param container {HTMLElement} - element to append the formatted `text` into
			 * @param regex {RegExp} - regex to match against `text`
			 */
			function embolden(container, regex, text) {
				let lastIndex = 0;

				for (let match of text.matchAll(regex)) {
					container.appendChild(document.createTextNode(text.substring(lastIndex, match.index)));

					let emboldened = document.createElement("b");
					emboldened.appendChild(document.createTextNode(match[0]));
					container.appendChild(emboldened);

					lastIndex = match.index + match[0].length;
				}
				container.appendChild(document.createTextNode(text.substring(lastIndex, text.length)));
			}
		</script>
	</body>
</html>
