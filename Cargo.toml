[package]
name = "translation_memory"
version = "0.1.0"
license = "MPL-2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.101"
async-trait = "0.1.89"
axum = { version = "0.8.8", features = ["macros"] }
base64 = "0.22.1"
clap = { version = "4.5.59", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["windows"], default-features = false }
env_logger = { version = "0.11.9", features = ["color"] }
log = "0.4.29"
quick-xml = { version = "0.39.1", features = ["serialize", "overlapped-lists"] }
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["json"] }
rusqlite = { version = "0.38.0", features = ["bundled", "time"] }
rust-embed = "8.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
shell-words = "1.1.1"
termcolor = "1.4.1"
tokio = { version = "1.49.0", features = ["io-std", "macros", "rt-multi-thread", "time"] }
toml = "1.0.2"
unic-langid = { version = "0.9.6", features = ["serde"] }
webbrowser = "1.1.0"
zip = "8.1.0"
