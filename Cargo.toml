[package]
name = "translation_memory"
version = "0.1.0"
license = "MPL-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.97"
async-trait = "0.1.88"
axum = { version = "0.8.3", features = ["macros"] }
base64 = "0.22.1"
bincode = "1.3.3"
clap = { version = "4.5.35", features = ["derive"] }
crossterm = { version = "0.27.0", features = ["windows"], default_features = false }
env_logger = { version = "0.11.8", features = ["color"] }
flate2 = "1.1.1"
log = "0.4.27"
quick-xml = { version = "0.37.4", features = ["serialize", "overlapped-lists"] }
regex = "1.11.1"
reqwest = { version = "0.12.15", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
shell-words = "1.1.0"
termcolor = "1.4.1"
tokio = { version = "1.44.1", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.8.20"
unic-langid = { version = "0.9.5", features = ["serde"] }
webbrowser = "1.0.4"
zip = "2.5.0"

[profile.dev.package.flate2]
opt-level = 3
